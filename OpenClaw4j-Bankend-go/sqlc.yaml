version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query"
    schema:
      - "../OpenClaw4j-Bankend/src/main/resources/sql/PostgreSQL/V0.0.1__init.sql"
      - "db/schema"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
