services:
  pgvector:
    image: pgvector/pgvector:pg18
    container_name: openclaw4j-pgvector
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openclaw4j}
      POSTGRES_USER: ${POSTGRES_USER:-openclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openclaw}
      TZ: Asia/Shanghai
    volumes:
      - ./data/pgvector:/var/lib/postgresql
      - ../OpenClaw4j-Bankend/src/main/resources/sql/PostgreSQL/V0.0.1__init.sql:/docker-entrypoint-initdb.d/01-openclaw4j-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7
    container_name: openclaw4j-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis/redis-master.conf:/usr/local/etc/redis/redis.conf:ro
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  aio-sandbox:
    image: ${AIO_SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
    container_name: openclaw4j-aio-sandbox
    profiles: ["aio-sandbox"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    mem_limit: ${AIO_SANDBOX_MEMORY_LIMIT:-2g}
    memswap_limit: ${AIO_SANDBOX_MEMORY_SWAP_LIMIT:-2g}
    pids_limit: ${AIO_SANDBOX_PIDS_LIMIT:-512}
    shm_size: ${AIO_SANDBOX_SHM_SIZE:-2gb}
    ports:
      - "127.0.0.1:${AIO_SANDBOX_PORT:-8080}:8080"
    environment:
      SANDBOX_API_KEY: ${AIO_SANDBOX_API_KEY:-}
      WORKSPACE: ${AIO_SANDBOX_WORKSPACE:-/home/gem}
      TZ: ${AIO_SANDBOX_TZ:-Asia/Shanghai}
    volumes:
      - ./data/aio-sandbox:${AIO_SANDBOX_WORKSPACE:-/home/gem}

  openclaw4j-sandbox:
    build:
      context: ../OpenClaw4j-Sandbox
      dockerfile: Dockerfile
    image: ${OPENCLAW_SANDBOX_IMAGE:-openclaw4j-sandbox:local}
    container_name: openclaw4j-sandbox
    profiles: ["sandbox"]
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "127.0.0.1:${OPENCLAW_SANDBOX_PORT:-9010}:9010"
    environment:
      OPENCLAW_SANDBOX_BIND: 0.0.0.0:9010
      OPENCLAW_SANDBOX_DEFAULT_TIMEOUT_MS: ${OPENCLAW_SANDBOX_DEFAULT_TIMEOUT_MS:-30000}
      OPENCLAW_SANDBOX_MAX_TIMEOUT_MS: ${OPENCLAW_SANDBOX_MAX_TIMEOUT_MS:-120000}
      OPENCLAW_SANDBOX_MEMORY_LIMIT: ${OPENCLAW_SANDBOX_MEMORY_LIMIT:-512M}
      OPENCLAW_SANDBOX_PROCESS_LIMIT: ${OPENCLAW_SANDBOX_PROCESS_LIMIT:-16}
      OPENCLAW_SANDBOX_DEPS_DIR: ${OPENCLAW_SANDBOX_DEPS_DIR:-/opt/openclaw4j-sandbox/deps}
      OPENCLAW_SANDBOX_PYTHON_RUNTIME: ${OPENCLAW_SANDBOX_PYTHON_RUNTIME:-/opt/openclaw4j-sandbox/deps/python/bin/python}
      OPENCLAW_SANDBOX_NODE_PATH: ${OPENCLAW_SANDBOX_NODE_PATH:-/opt/openclaw4j-sandbox/deps/node/node_modules}
      RUST_LOG: ${OPENCLAW_SANDBOX_RUST_LOG:-openclaw4j_sandbox=info,tower_http=info}
      TZ: ${OPENCLAW_SANDBOX_TZ:-Asia/Shanghai}
    # 依赖和 sandlock 二进制默认烘焙进镜像，避免空 volume 遮蔽内置内容。
    # 本地调试自编译 sandlock 时，可以临时挂只读单文件：
    # volumes:
    #   - ./data/sandbox-bin/sandlock:/usr/local/bin/sandlock:ro

